<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FutTV | EN VIVO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">

<style>
:root{
  color-scheme:dark;
  --bg:#0b0e13;
  --panel:#12161d;
  --panel2:#171c25;
  --line:#252c38;
  --line-strong:#384254;
  --text:#eef1f6;
  --muted:#8c96a8;
  --accent:#2f6fed;
  --accent-hover:#4782f5;
  --live:#ef4444;
  --radius:8px;
}

*{ box-sizing:border-box; }

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:var(--bg);
  color:var(--text);
  font:15px/1.5 Inter,system-ui,"Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}

.wrap{
  width:min(1500px,calc(100% - 32px));
  height:100dvh;
  margin:auto;
  display:flex;
  flex-direction:column;
  padding-bottom:14px;
  overflow:hidden;
}

/* ENCABEZADO */

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0;
  height:58px;
  border-bottom:1px solid var(--line);
  margin-bottom:14px;
}

.logo{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.5px;
}

.logo span{ color:var(--accent-hover); }

/* INDICADOR EN VIVO */

.live,
.channel-description{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
  letter-spacing:.1em;
}

.live::before,
.channel-description::before{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--live);
}

.live{
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  padding:5px 11px;
  border-radius:6px;
}

/* DISTRIBUCIÓN */

.content{
  display:grid;
  grid-template-columns:minmax(0,1fr) 320px;
  gap:14px;
  flex:1;
  min-height:0;
  overflow:hidden;
}

.player-panel,
.side-panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  min-width:0;
  min-height:0;
}

/* REPRODUCTOR */

.player-panel{
  padding:10px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.screen{
  width:100%;
  aspect-ratio:16/9;
  max-height:calc(100dvh - 235px);
  background:#000;
  border-radius:var(--radius);
  overflow:hidden;
  display:grid;
  place-items:center;
}

iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:#000;
}

.placeholder{
  text-align:center;
  color:var(--muted);
  padding:20px;
}

.placeholder strong{
  display:block;
  color:var(--text);
  font-size:17px;
  font-weight:600;
  margin-bottom:6px;
}

.now-playing{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:11px 4px 0;
}

.now-label{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:600;
  letter-spacing:.12em;
}

.now-name{
  font-size:18px;
  font-weight:700;
  line-height:1.35;
}

/* CONTADORES */

.viewers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.viewer-box{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:8px 12px;
  min-width:0;
}

.viewer-info{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  column-gap:10px;
}

.viewer-label{
  color:var(--muted);
  font-size:10px;
  font-weight:600;
  letter-spacing:.1em;
}

.viewer-number{
  grid-column:2;
  grid-row:1 / 3;
  font-size:22px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}

.viewer-status{
  grid-column:1;
  color:#677287;
  font-size:10px;
}

/* PANEL DE CANALES */

.side-panel{
  display:flex;
  flex-direction:column;
  padding:14px 12px 12px;
  overflow:hidden;
}

.channels-heading{
  flex-shrink:0;
  padding:0 2px 12px;
  border-bottom:1px solid var(--line);
  margin-bottom:12px;
}

.channels-heading h2{
  font-size:15px;
  font-weight:700;
  margin:0;
}

.channels-heading p{
  color:var(--muted);
  font-size:11px;
  margin:2px 0 0;
}

.channels-list{
  flex:1;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-auto-rows:max-content;
  align-content:start;
  gap:8px;
  overflow-y:auto;
  overflow-x:hidden;
  min-height:0;
  padding-right:4px;
  scrollbar-width:thin;
  scrollbar-color:var(--line-strong) transparent;
}

.channel-button{
  width:100%;
  min-height:88px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  text-align:center;
  padding:12px 8px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--panel2);
  color:var(--text);
  cursor:pointer;
  transition:background .15s,border-color .15s;
  font:inherit;
}

.channel-button:hover{
  background:#1d2430;
  border-color:var(--line-strong);
}

.channel-button.active{
  background:#16264a;
  border-color:var(--accent);
  box-shadow:inset 0 0 0 1px var(--accent);
}

.channel-button:focus-visible,
.donation-button:focus-visible{
  outline:2px solid var(--accent-hover);
  outline-offset:-4px;
}

.channel-name{
  display:block;
  font-size:16px;
  font-weight:700;
  line-height:1.25;
}

.channel-button.active .channel-description{ color:var(--text); }

/* BOTÓN DE DONAR */

.donation-button{
  display:block;
  flex-shrink:0;
  margin-top:12px;
  padding:12px 8px;
  border-radius:var(--radius);
  background:var(--accent);
  color:#fff;
  text-align:center;
  text-decoration:none;
  font-weight:600;
  font-size:14px;
  transition:background .15s;
}

.donation-button:hover{ background:var(--accent-hover); }

/* TABLET */

@media(max-width:1000px){
  .content{
    grid-template-columns:minmax(0,1fr) 260px;
    gap:10px;
  }
  .side-panel{ padding:10px 8px; }
  .channel-name{ font-size:14px; }
}

/* CELULARES */

@media(max-width:650px){
  .wrap{ width:calc(100% - 14px); padding-bottom:7px; }
  header{ height:46px; margin-bottom:7px; }
  .logo{ font-size:20px; }

  .content{
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:auto minmax(0,1fr);
    gap:7px;
  }

  .player-panel{ padding:6px; }
  .screen{ max-height:34dvh; }
  .now-playing{ padding:6px 2px 0; }
  .now-name{ font-size:15px; }
  .viewers{ margin-top:6px; gap:6px; }
  .viewer-box{ padding:5px 8px; }
  .viewer-label{ font-size:8px; }
  .viewer-number{ font-size:17px; }
  .viewer-status{ font-size:8px; }

  .side-panel{ padding:8px 7px; }
  .channels-heading{ padding-bottom:6px; margin-bottom:7px; }
  .channels-heading h2{ font-size:13px; }
  .channels-heading p{ display:none; }

  .channels-list{ gap:6px; }
  .channel-button{ min-height:60px; padding:7px 5px; gap:3px; }
  .channel-name{ font-size:14px; }
  .channel-description{ font-size:9px; }

  .donation-button{ margin-top:7px; padding:9px 5px; font-size:13px; }
}

/* PANTALLAS BAJAS */

@media(max-height:550px) and (min-width:651px){
  .wrap{ padding-bottom:5px; }
  header{ height:40px; margin-bottom:6px; }
  .logo{ font-size:19px; }
  .player-panel{ padding:5px; }
  .screen{ max-height:calc(100dvh - 165px); }
  .now-playing{ padding-top:5px; }
  .now-label{ display:none; }
  .viewers{ margin-top:5px; gap:5px; }
  .viewer-box{ padding:3px 8px; }
  .viewer-number{ font-size:16px; }

  .side-panel{ padding:7px; }
  .channels-heading{ padding-bottom:5px; margin-bottom:6px; }
  .channels-heading p{ display:none; }
  .channel-button{ min-height:56px; padding:6px 4px; gap:2px; }
  .channel-name{ font-size:13px; }
  .donation-button{ margin-top:6px; padding:7px; }
}
</style>
</head>

<body>

<main class="wrap">

<header>
  <div class="logo">FUT<span>TV</span></div>
  <div class="live">EN VIVO</div>
</header>

<div class="content">

  <!-- REPRODUCTOR PRINCIPAL -->

  <section class="player-panel">

    <div class="screen" id="screen">
      <div class="placeholder">
        <strong>Preparando transmisión...</strong>
        <div>Bienvenido a FutTV.</div>
      </div>
    </div>

    <div class="now-playing">
      <div>
        <span class="now-label">REPRODUCIENDO AHORA</span>
        <div class="now-name" id="currentChannelName">TUDN</div>
      </div>
      <span class="live">EN VIVO</span>
    </div>

    <!-- CONTADORES -->

    <div class="viewers">

      <div class="viewer-box">
        <div class="viewer-info">
          <span class="viewer-label">ESTE CANAL</span>
          <span class="viewer-number" id="matchViewers">—</span>
          <span class="viewer-status" id="matchStatus">Conectando...</span>
        </div>
      </div>

      <div class="viewer-box">
        <div class="viewer-info">
          <span class="viewer-label">TOTAL FUTTV</span>
          <span class="viewer-number" id="globalViewers">—</span>
          <span class="viewer-status" id="globalStatus">Conectando...</span>
        </div>
      </div>

    </div>

  </section>

  <!-- CANALES Y DONACIÓN -->

  <aside class="side-panel">

    <div class="channels-heading">
      <h2>Canales</h2>
    </div>

    <div class="channels-list" id="channelsList">
      <!-- Los canales se generan con JavaScript -->
    </div>

    <a
      href="https://paypal.me/OficialFutTV"
      target="_blank"
      rel="noopener noreferrer"
      class="donation-button"
    >
      Donar ahora
    </a>

  </aside>

</div>

</main>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==================================
   CONFIGURACIÓN DE CANALES
================================== */

/*
  Aquí puedes agregar, quitar o modificar canales.

  El campo id debe ser único.
  El campo enlace contiene la dirección de la transmisión.

  CANAL_PRINCIPAL determina cuál aparece
  automáticamente al entrar a FutTV.
*/

const CANALES = [

  {
    nombre: "TUDN",
    id: "tudn",
    enlace: "https://tvf90.com/3.php?stream=tudn"
  },

  {
    nombre: "ESPN",
    id: "espn",
    enlace: "https://tvf90.com/canal.php?stream=espn"
  },

  {
    nombre: "ESPN 2",
    id: "espn2",
    enlace: "https://tvf90.com/1.php?stream=espn2"
  },

  {
    nombre: "FOX SPORTS 2 USA",
    id: "foxsports2",
    enlace: "https://tvf90.com/1.php?stream=foxsports2_usa"
  }

];

/* CANAL PRINCIPAL AL ENTRAR */

const CANAL_PRINCIPAL = "tudn";

/* ==================================
   CONFIGURACIÓN SUPABASE
================================== */

const SUPABASE_URL =
  "https://iskfukonptkxejgfyxfr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_H802teHC31djz9SamTNQIg_dbvZwHfR";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* ==================================
   IDENTIFICADOR DE VISITANTE
================================== */

const VISITOR_ID =
  (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : Date.now() + "-" + Math.random().toString(36).slice(2);

/* ==================================
   ESTADO DE FUTTV
================================== */

let canalActual = null;
let globalChannel = null;
let matchChannel = null;

/* ==================================
   ELEMENTOS
================================== */

const screen = document.getElementById("screen");
const channelsList = document.getElementById("channelsList");

/* ==================================
   REPRODUCTOR
================================== */

function mostrarError(mensaje){

  const placeholder = document.createElement("div");
  placeholder.className = "placeholder";

  const title = document.createElement("strong");
  title.textContent = "Transmisión no disponible";

  const description = document.createElement("div");
  description.textContent = mensaje;

  placeholder.append(title, description);

  screen.replaceChildren(placeholder);

}

function cargarCanal(canal){

  let url;

  try{
    url = new URL(canal.enlace);
  }catch{
    mostrarError("El enlace del canal no es válido.");
    return;
  }

  if(url.protocol !== "https:"){
    mostrarError("El reproductor requiere una dirección HTTPS.");
    return;
  }

  const frame = document.createElement("iframe");

  frame.src = url.href;
  frame.title = "FutTV - " + canal.nombre;
  frame.allow = "autoplay; fullscreen; picture-in-picture";
  frame.allowFullscreen = true;
  frame.referrerPolicy = "strict-origin-when-cross-origin";

  screen.replaceChildren(frame);

}

/* ==================================
   GENERAR PANEL DE CANALES
================================== */

function generarCanales(){

  channelsList.replaceChildren();

  CANALES.forEach(canal => {

    const button = document.createElement("button");
    button.type = "button";
    button.className = "channel-button";
    button.dataset.id = canal.id;

    const info = document.createElement("span");
    info.className = "channel-info";

    const name = document.createElement("span");
    name.className = "channel-name";
    name.textContent = canal.nombre;

    const description = document.createElement("span");
    description.className = "channel-description";
    description.textContent = "EN VIVO";

    info.append(name, description);
    button.append(info);

    button.addEventListener("click", () => {
      seleccionarCanal(canal.id);
    });

    channelsList.appendChild(button);

  });

}

/* ==================================
   SELECCIONAR CANAL
================================== */

function actualizarCanalActivo(){

  document.querySelectorAll(".channel-button").forEach(button => {

    const activo = button.dataset.id === canalActual.id;

    button.classList.toggle("active", activo);

    const name = button.querySelector(".channel-name");

    if(name){
      name.classList.toggle("channel-active", activo);
    }

  });

}

function seleccionarCanal(id){

  const canal = CANALES.find(item => item.id === id);

  if(!canal){
    return;
  }

  canalActual = canal;

  document.getElementById("currentChannelName").textContent =
    canal.nombre;

  actualizarCanalActivo();

  cargarCanal(canal);

  reiniciarContadorPartido();

}

/* ==================================
   CONTADORES DE ESPECTADORES
================================== */

function contarEspectadores(channel, elemento, estado){

  const presence = channel.presenceState();
  const total = Object.keys(presence).length;

  document.getElementById(elemento).textContent =
    total.toLocaleString("es-MX");

  document.getElementById(estado).textContent =
    "En tiempo real";

}

/* ==================================
   CONECTAR SALA DE SUPABASE
================================== */

function conectarSala(nombreSala, elemento, estado, partidoId){

  const channel = supabaseClient.channel(nombreSala, {
    config: {
      presence: {
        key: VISITOR_ID
      }
    }
  });

  channel.on(
    "presence",
    { event: "sync" },
    () => {
      contarEspectadores(channel, elemento, estado);
    }
  );

  channel.subscribe(async status => {

    if(status === "SUBSCRIBED"){

      try{

        await channel.track({
          visitante: VISITOR_ID,
          partido: partidoId || null,
          conectado: new Date().toISOString()
        });

        contarEspectadores(channel, elemento, estado);

      }catch(error){

        console.error("Error registrando visitante:", error);

      }

    }

    if(
      status === "CHANNEL_ERROR" ||
      status === "TIMED_OUT" ||
      status === "CLOSED"
    ){

      document.getElementById(elemento).textContent = "—";

      document.getElementById(estado).textContent =
        "Reconectando...";

      console.error("Estado de conexión:", status);

    }

  });

  return channel;

}

/* ==================================
   CONTADOR GLOBAL
================================== */

function iniciarContadorGlobal(){

  globalChannel = conectarSala(
    "futtv-global",
    "globalViewers",
    "globalStatus",
    null
  );

}

/* ==================================
   CONTADOR DEL CANAL ACTUAL
================================== */

async function reiniciarContadorPartido(){

  const matchNumber = document.getElementById("matchViewers");
  const matchStatus = document.getElementById("matchStatus");

  matchNumber.textContent = "—";
  matchStatus.textContent = "Conectando...";

  if(matchChannel){

    const canalAnterior = matchChannel;
    matchChannel = null;

    await supabaseClient.removeChannel(canalAnterior);

  }

  if(!canalActual){
    return;
  }

  const canalId = canalActual.id;

  matchChannel = conectarSala(
    "futtv-match-" + canalId,
    "matchViewers",
    "matchStatus",
    canalId
  );

}

/* ==================================
   INICIAR FUTTV
================================== */

document.addEventListener("DOMContentLoaded", () => {

  generarCanales();

  const canalInicial = CANALES.find(
    canal => canal.id === CANAL_PRINCIPAL
  );

  if(canalInicial){
    seleccionarCanal(canalInicial.id);
  }else{
    mostrarError("No se encontró el canal principal configurado.");
  }

  if(window.supabase){

    iniciarContadorGlobal();

  }else{

    document.getElementById("matchStatus").textContent =
      "Error de conexión";

    document.getElementById("globalStatus").textContent =
      "Error de conexión";

    console.error("No se pudo cargar Supabase.");

  }

});

</script>

</body>
</html>
